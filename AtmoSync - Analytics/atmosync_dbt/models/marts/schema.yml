version: 2

models:
  - name: fct_spoilage_arbitrage
    description: "Calculates real-time container thermal degradation and recommends secondary market arbitrage."
    columns:
      - name: container_id
        description: "Unique identifier for the shipping container"
        tests:
          - not_null
          - unique
      - name: thermal_status
        description: "Risk status based on micro-climate temperature thresholds"
        tests:
          - not_null
      - name: recommended_reroute_market
        description: "Target market port for salvage value realization"
        tests:
          - not_null